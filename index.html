<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tabi Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tabi Quest">
<meta name="theme-color" content="#12172b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{
  --bg:#12172b; --panel:#1d2442; --panel2:#283160; --line:#3a4580;
  --text:#f2f4ff; --muted:#a3acd0;
  --good:#5fb0ff;   /* blue  = correct (always shown with a check mark and text) */
  --bad:#ffb14a;    /* orange = wrong  (always shown with an X mark and text) */
  --enemy:#c896ff; --yen:#ffe27a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
[lang="ja"]{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",-apple-system,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 14px)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
h1{font-size:34px;margin:18px 0 2px;letter-spacing:.5px}
h2{font-size:22px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 16px;line-height:1.4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{display:block;width:100%;padding:16px;border-radius:14px;background:var(--good);color:#0b1330;font-weight:700;font-size:19px;margin-bottom:10px}
.ghost{display:block;width:100%;padding:13px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tog{min-width:74px;padding:9px 10px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);font-weight:700}
.tog.on{border-color:var(--good);background:#22407a}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{color:var(--muted);font-size:12px}
.yen{color:var(--yen);font-weight:700}
.note{color:var(--muted);font-size:13px;line-height:1.45}

/* ---------- fight ---------- */
.top{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.top .where{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{width:40px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:17px}
.enemy{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.enemy.elite{border:2px dashed var(--yen)}
.enemy.boss{border:2px solid var(--enemy)}
.bossp{min-height:0;padding-top:6px}
.goal{font-size:13px;color:var(--yen);margin-bottom:8px;text-align:left}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;margin-bottom:10px;text-align:left}
.bub.you{border-radius:14px 14px 4px 14px;color:var(--muted);font-size:14px;text-align:right}
.bub .who{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px}
.bub .bj{font-size:26px;font-weight:700;line-height:1.3;word-break:break-word}
.bub .bj.sm{font-size:20px}
.bub .hear{display:block;margin:4px auto}
.bub #hid{text-align:center}
.link{background:none;color:var(--good);font-size:13px;padding:6px 0 0;text-decoration:underline}
.bossp .main.en{font-size:19px}
.tagline{color:var(--yen);font-weight:700;font-size:12px;letter-spacing:1px}
.enemy .face{font-size:38px;line-height:1}
.enemy .info{flex:1;min-width:0}
.enemy .name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enemy .tag{font-size:11px;color:var(--yen);font-weight:700;letter-spacing:.4px}
.bar{height:14px;background:#0c1022;border-radius:8px;overflow:hidden;margin-top:5px;border:1px solid var(--line)}
.bar i{display:block;height:100%;transition:width .25s}
.bar.e i{background:repeating-linear-gradient(45deg,var(--enemy),var(--enemy) 6px,#a877e0 6px,#a877e0 12px)}
.bar.p i{background:var(--good)}
.hpnum{font-size:12px;color:var(--muted);margin-top:2px}
.timer{height:8px;background:#0c1022;border-radius:6px;margin:10px 0 0;position:relative;overflow:hidden}
.timer i{display:block;height:100%;background:#e9ecff;width:100%}
.timer.fastzone i{background:var(--yen)}
.timerlbl{font-size:11px;color:var(--muted);height:15px;margin-top:2px;text-align:right}
.prompt{text-align:center;padding:8px 4px 10px;min-height:118px;display:flex;flex-direction:column;justify-content:center}
.prompt .ask{color:var(--muted);font-size:14px;margin-bottom:6px}
.prompt .main{font-weight:700;line-height:1.25;word-break:break-word}
.prompt .rom{color:var(--muted);font-size:14px;margin-top:4px}
.s1{font-size:54px}.s2{font-size:40px}.s3{font-size:29px}.s4{font-size:23px}
.en{font-size:24px}
.hear{margin:0 auto;width:120px;height:74px;border-radius:16px;background:var(--panel2);border:2px solid var(--line);font-size:34px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{position:relative;width:100%;min-height:54px;padding:8px 40px 8px 44px;border-radius:13px;background:var(--panel2);border:2px solid var(--line);font-size:18px;text-align:left;line-height:1.25}
.opt .n{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:6px;background:#0c1022;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center}
.opt .mk{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:900}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt.right{border:3px solid var(--good);background:#1d3a70}
.opt.right .mk{color:var(--good)}
.opt.wrong{border:3px dashed var(--bad);background:#4a3415}
.opt.wrong .mk{color:var(--bad)}
.opt:disabled{opacity:1}
.tray{min-height:58px;border:2px dashed var(--line);border-radius:13px;padding:7px;display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;align-items:center}
.tray:empty::before{content:"Tap the pieces below in order";color:var(--muted);font-size:13px;padding-left:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:54px}
.tile{padding:10px 14px;border-radius:11px;background:var(--panel2);border:2px solid var(--line);font-size:21px;font-weight:600}
.tile.used{visibility:hidden}
.me{margin-top:auto;padding-top:12px}
.me .line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.me .combo{color:var(--yen);font-weight:700}

/* ---------- feedback sheet ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;pointer-events:none}
.sheet .in{pointer-events:auto;width:100%;max-width:480px;background:#0d1226;border-top:4px solid var(--good);border-radius:18px 18px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.sheet.miss .in{border-top:4px dashed var(--bad)}
.sheet .head{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet.hit .head{color:var(--good)} .sheet.miss .head{color:var(--bad)}
.sheet .detail{color:var(--muted);font-size:14px;margin-top:3px}
.ans{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.ans .lbl{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.ans .jp{font-size:28px;font-weight:700;line-height:1.3;word-break:break-word}
.ans .jp.long{font-size:20px}
.ans .rd{font-size:17px;margin-top:2px}
.ans .rm{font-size:14px;color:var(--muted)}
.ans .mn{font-size:17px;margin-top:4px;color:var(--yen)}
.sheet .btns{display:flex;gap:8px}
.sheet .btns .ghost{width:64px;margin:0;flex:none;font-size:20px;padding:10px}
.sheet .btns .big{margin:0;flex:1;padding:13px}
.sheet .in{max-height:88vh;overflow-y:auto}
.why{background:#151b38;border-left:4px solid var(--yen);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:14px;line-height:1.45}
.why .lbl{font-size:11px;color:var(--yen);letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.why div+div{margin-top:5px}
.abil{display:flex;gap:6px;margin-bottom:8px}
.ab{flex:1;padding:9px 2px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.ab:disabled{opacity:.4}
.opt.gone{opacity:.25;text-decoration:line-through}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--panel);border:2px solid var(--line);margin-bottom:10px}
.pick.rare{border:2px dashed var(--yen)}
.pick .pi{font-size:34px;line-height:1}
.pick b{display:block;font-size:17px;margin-bottom:2px}
.pick b small{color:var(--muted);font-weight:400}
.pick span span{color:var(--muted);font-size:14px;line-height:1.35}
.shopit{display:flex;gap:10px;align-items:center}
.si{font-size:30px}.sinfo{flex:1;min-width:0}
.buy{min-width:84px;padding:9px;border-radius:10px;background:var(--good);color:#0b1330;font-weight:700;line-height:1.25}
.buy.no{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.06)}}

/* ---------- overlay ---------- */
.over{position:fixed;inset:0;background:rgba(8,10,24,.92);z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}
.over .box{width:100%;max-width:420px}
.center{text-align:center}
.placejp{font-size:60px;font-weight:800;margin:6px 0}
.missrow{padding:8px 0;border-bottom:1px solid var(--line)}
.missrow:last-child{border-bottom:0}
.missrow .a{font-size:19px;font-weight:700}
.missrow .b{font-size:13px;color:var(--muted)}
</style>
</head>

   =====================================================================

   PART 1 OF 3:  THE WORD LIST
   ---------------------------------------------------------------------
   This is the one list of words, phrases and signs. To add a word,
   add ONE new line anywhere under the place it belongs to.

   Each line looks like this:

        Japanese | reading in kana | English meaning | sign

   - Use the | character between the parts.
   - If the Japanese is already all kana, leave the reading empty:
        コーヒー||coffee
   - For phrases, put spaces between the words in the reading:
        トイレはどこですか|トイレ は どこ です か|Where is the toilet?
   - Add |sign at the end only if it is something you see on signs.

/* ---------- kana to romaji (automatic) ---------- */
const ROMA = (function(){
  const m = {};
  const rows = {'':'あいうえお',k:'かきくけこ',s:'さしすせそ',t:'たちつてと',n:'なにぬねの',h:'はひふへほ',m:'まみむめも',r:'らりるれろ',
                g:'がぎぐげご',z:'ざじずぜぞ',d:'だぢづでど',b:'ばびぶべぼ',p:'ぱぴぷぺぽ'};
  const v = 'aiueo';
  for (const c in rows) for (let i=0;i<5;i++) m[rows[c][i]] = c+v[i];
  Object.assign(m,{し:'shi',ち:'chi',つ:'tsu',ふ:'fu',じ:'ji',ぢ:'ji',づ:'zu',や:'ya',ゆ:'yu',よ:'yo',わ:'wa',を:'o',ん:'n',ゔ:'vu',
                   ぁ:'a',ぃ:'i',ぅ:'u',ぇ:'e',ぉ:'o'});
  const y = {き:'ky',し:'sh',ち:'ch',に:'ny',ひ:'hy',み:'my',り:'ry',ぎ:'gy',じ:'j',び:'by',ぴ:'py'};
  const s = {ゃ:'a',ゅ:'u',ょ:'o'};
  for (const a in y) for (const b in s) m[a+b] = y[a]+s[b];
  Object.assign(m,{てぃ:'ti',でぃ:'di',ふぁ:'fa',ふぃ:'fi',ふぇ:'fe',ふぉ:'fo',うぃ:'wi',うぇ:'we',ちぇ:'che',しぇ:'she',じぇ:'je',でゅ:'dyu'});
  return m;
})();
function toHira(s){ let o=''; for (const ch of s){ const c=ch.charCodeAt(0); o += (c>=0x30A1&&c<=0x30F6)?String.fromCharCode(c-0x60):ch; } return o; }
function romajiWord(word){
  const h = toHira(word); let out='', gem=false;
  for (let i=0;i<h.length;i++){
    const c=h[i];
    if (c==='っ'){ gem=true; continue; }
    if (c==='ー'){ const mm=out.match(/[aiueo](?=[^aiueo]*$)/); if(mm) out+=mm[0]; continue; }
    let r = ROMA[h.substr(i,2)]; if (r) i++; else r = ROMA[c];
    if (r===undefined){ out+=c; gem=false; continue; }
    if (gem){ out += (r[0]==='c'?'t':r[0]); gem=false; }
    out += r;
  }
  return out;
}
function romaji(kana){
  return kana.split(' ').map(t=>{
    if (t==='は') return 'wa'; if (t==='へ') return 'e'; if (t==='＿') return '__';
    return romajiWord(t);
  }).join(' ').replace(/konnichiha/g,'konnichiwa').replace(/konbanha/g,'konbanwa').replace(/、/g,',').replace(/。/g,'.');
}

function weighted(items, wf){ let t=0; const ws=items.map(x=>{const w=wf(x); t+=w; return w;}); let r=Math.random()*t; for(let i=0;i<items.length;i++){ r-=ws[i]; if(r<=0) return items[i]; } return items[items.length-1]; }

/* ---------- building questions ---------- */
function distractors(w, n, mode){
  // mode: 'mean' | 'jp' | 'kana'
  const val = x => mode==='mean' ? x.mean : mode==='jp' ? x.jp : x.kana;
  const kset = [...w.jp].filter(c=>KANJI.test(c));
  let c = WORDS.filter(x => x!==w && base(x.mean)!==base(w.mean) && x.kana!==w.kana && x.jp!==w.jp);
  if (mode==='kana') c = c.filter(x => x.hasKanji && !x.phrase);
  c = c.map(x=>{
    let s = Math.random()*3;
    if (x.phrase===w.phrase) s += 4;
    if (x.place===w.place) s += 1;
    if (kset.some(k=>x.jp.indexOf(k)>=0)) s += 2.5;
    if (mode==='kana' && Math.abs(x.kana.length-w.kana.length)<=1) s += 1.5;
    if (mode==='kana' && x.jp.length===w.jp.length) s += 2;
    return [s,x];
  }).sort((a,b)=>b[0]-a[0]);
  const out=[], seen=new Set([mode==='mean'?base(w.mean):val(w)]);
  for (const [,x] of c){ const k = mode==='mean'?base(x.mean):val(x); if(seen.has(k)) continue; seen.add(k); out.push(x); if(out.length===n) break; }
  return out;
}
const LOOK = ['シツ','ソン','クケ','ウワ','コユ','スヌ','チテ','ナメ','アマ','ルレ','ロコ','タク','フラ','さち','きさ','ぬめ','はほ','わね','ねれ','るろ','あお','いり','こに','たな','けは','まも','めの','つう'];
function kanaFakes(w){
  const right = romaji(w.kana), out = {}, chars=[...w.kana];
  const size = ()=>Object.keys(out).length;
  const idx = shuffle(chars.map((_,i)=>i));
  for (const i of idx){
    for (const pr of shuffle(LOOK)){
      const p = pr.indexOf(chars[i]); if (p<0) continue;
      const other = pr[1-p], c2 = chars.slice(); c2[i] = other;
      const r = romaji(c2.join(''));
      if (r!==right && !out[r]) out[r] = 'Look-alike kana: '+chars[i]+' is "'+romaji(chars[i])+'". '+other+' is "'+romaji(other)+'".';
    }
    if (size()>=3) break;
  }
  // not enough look-alikes: change one vowel sound instead
  let guard = 0;
  while (size()<3 && guard++<60){
    const pos = []; for (let i=0;i<right.length;i++) if ('aiueo'.indexOf(right[i])>=0) pos.push(i);
    if (!pos.length) break;
    const i = pick(pos), v = pick('aiueo'.replace(right[i],'').split(''));
    const r = right.slice(0,i)+v+right.slice(i+1);
    if (!out[r]) out[r] = '';
  }
  return shuffle(Object.keys(out)).slice(0,3).map(r=>({r:r, note:out[r]}));
}
function romLine(kana){ return save.set.romaji ? '<small>'+esc(romaji(kana))+'</small>' : ''; }

function makeWordQ(w, avoid){
  const short = !w.phrase && w.kana.length<=9;
  let types = [['meaning', w.sign?4:3], ['reverse',2]];
  if (w.hasKanji && short) types.push(['reading',3]);
  if (!w.hasKanji && short && w.kana.length>=2) types.push(['kana',1.5]);
  if (listenOK()) types.push(['listen',2]);
  if (avoid && avoid.length){ const f=types.filter(t=>avoid.indexOf(t[0])<0); if(f.length) types=f; }
  const type = weighted(types, t=>t[1])[0];
  const q = {type, item:w, isWord:true, limit:CFG.timeChoice, fast:CFG.fastChoice,
             card:{jp:w.jp, kana:w.kana, mean:w.mean}, say:sayOf(w)};
  let opts;
  if (type==='meaning'){
    q.ask = w.sign ? 'You see this sign. What does it mean?' : 'What does this mean?';
    q.main = '<div class="main '+sizeClass(w.jp)+'">'+J(w.jp)+'</div>' + (save.set.romaji?'<div class="rom">'+esc(romaji(w.kana))+'</div>':'');
    opts = [{h:esc(w.mean),ok:true}].concat(distractors(w,3,'mean').map(x=>({h:esc(x.mean), src:x})));
  } else if (type==='reverse'){
    q.ask = 'Which one is this in Japanese?';
    q.main = '<div class="main en">'+esc(w.mean)+'</div>';
    opts = [{h:J(w.jp)+romLine(w.kana),ok:true}].concat(distractors(w,3,'jp').map(x=>({h:J(x.jp)+romLine(x.kana), src:x})));
  } else if (type==='reading'){
    q.ask = 'How do you read this?';
    q.main = '<div class="main '+sizeClass(w.jp)+'">'+J(w.jp)+'</div>';
    opts = [{h:J(w.kana)+romLine(w.kana),ok:true}].concat(distractors(w,3,'kana').map(x=>({h:J(x.kana)+romLine(x.kana), src:x})));
  } else if (type==='kana'){
    q.ask = 'Read the kana. Which sound is it?';
    q.main = '<div class="main '+sizeClass(w.jp)+'">'+J(w.jp)+'</div>';
    opts = [{h:esc(romaji(w.kana)),ok:true}].concat(kanaFakes(w).map(f=>({h:esc(f.r), note:f.note})));
  } else {
    q.ask = 'Listen. What does it mean?';
    q.limit = CFG.timeListen; q.autoSay = true;
    q.main = '<button class="hear" id="hearBtn" aria-label="Play the sound again">🔊</button><div class="rom">Tap to hear it again</div>';
    opts = [{h:esc(w.mean),ok:true}].concat(distractors(w,3,'mean').map(x=>({h:esc(x.mean), src:x})));
  }
  q.opts = shuffle(opts);
  return q;
}
function makePartQ(p){
  const filled = p.jp.replace('＿', p.ans);
  const q = {type:'particle', item:p, limit:CFG.timeChoice, fast:CFG.fastChoice,
             card:{jp:filled, kana:p.kana.replace('＿',p.ans), mean:p.mean}, say:filled};
  q.ask = 'Pick the particle for the gap: “'+p.mean+'”';
  const shown = p.jp.replace('＿','〔　〕');
  q.main = '<div class="main '+sizeClass(shown)+'">'+J(shown)+'</div>' + (save.set.romaji?'<div class="rom">'+esc(romaji(p.kana))+'</div>':'');
  q.opts = shuffle([{h:J(p.ans)+romLine(p.ans),ok:true}].concat(p.wrong.map(x=>({h:J(x)+romLine(x), p:x}))));
  return q;
}
function makeOrderQ(s){
  const q = {type:'order', item:s, limit:CFG.timeOrder, fast:CFG.fastOrder,
             card:{jp:s.chunks.join(''), kana:s.kana, mean:s.mean}, say:s.chunks.join('')};
  q.ask = 'Put the pieces in order to say:';
  q.main = '<div class="main en">'+esc(s.mean)+'</div>';
  let t = shuffle(s.chunks), guard=0;
  while (t.join('|')===s.chunks.join('|') && guard++<10) t = shuffle(s.chunks);
  q.tiles = t; q.placed = [];
  return q;
}

function numKana(n){
  const d=['','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
  const man=Math.floor(n/10000), sen=Math.floor(n%10000/1000), hya=Math.floor(n%1000/100), ju=Math.floor(n%100/10), one=n%10;
  let s='';
  if (man) s+=d[man]+'まん';
  if (sen) s+= sen===1?'せん':sen===3?'さんぜん':sen===8?'はっせん':d[sen]+'せん';
  if (hya) s+= hya===1?'ひゃく':hya===3?'さんびゃく':hya===6?'ろっぴゃく':hya===8?'はっぴゃく':d[hya]+'ひゃく';
  if (ju)  s+= ju===1?'じゅう':d[ju]+'じゅう';
  if (one) s+=d[one];
  return s;
}

function dPrice(list, pj, pk, pe){
  const amt = pick(list);
  const c = [...new Set([amt+100, amt-100, amt+300, amt+1000, amt-1000, amt+60, amt<2000?amt*10:amt-300])].filter(v=>v>0 && v!==amt);
  return sDetail(X((pj||'')+amt+'円です', (pk?pk+' ':'')+numKana(amt)+'えん です', (pe||'It is ')+amt.toLocaleString('en-US')+' yen.'),
                 'How much is it?', yenFmt(amt), shuffle(c).slice(0,3).map(yenFmt), NUMWHY);
}
function dNum(vals, line, ask, fmt, why){
  const n = pick(vals);
  return sDetail(line(n), ask, fmt(n), others(vals,n,3).map(fmt), why||'');
}
const TIMEWHY = 'Clock hours: 4時 よじ, 7時 しちじ, 9時 くじ. 半 (はん) = half past.';
function dTime(hours, line, ask){
  const all=[]; hours.forEach(h=>{ all.push([h,false]); all.push([h,true]); });
  const r = pick(all), lab = t=>t[0]+(t[1]?':30':':00');
  return sDetail(line(r[0]+'時'+(r[1]?'半':''), HOURK[r[0]]+(r[1]?'はん':''), lab(r)), ask, lab(r), others(all,r,3).map(lab), TIMEWHY);
}

function pickBoss(placeId){
  const list = BOSSES[placeId];
  if (!save.boss) save.boss = {};
  const low = Math.min.apply(null, list.map(b=>save.boss[b.id]||0));
  const sc = pick(list.filter(b=>(save.boss[b.id]||0)===low));   // the one you have seen least
  save.boss[sc.id] = (save.boss[sc.id]||0)+1; writeSave();
  return sc;
}
function fill3(given, pool, same, right){
  const out=[];
  given.concat(shuffle(pool)).forEach(x=>{ if (out.length<3 && !same(x,right) && !out.some(y=>same(x,y))) out.push(x); });
  return out;
}
function makeBossQ(st, e){
  const npc=st.npc, q={boss:true, noMiss:true, step:st, item:{key:'B:'+e.id+':'+e.stepIdx}};
  const hide = st.t==='detail' && listenOK();
  let pre='<div class="goal">🎯 '+esc(e.goal)+'</div>';
  if (npc){
    q.sayStart=npc.jp; q.autoSay=true;
    const shown = st.t==='detail' ? npc.kana : npc.jp;
    pre+='<div class="bub"><div class="who">'+esc(e.who)+' says:</div>'
      +(hide ? '<div id="hid"><button class="hear" id="hearBtn" aria-label="Hear it again">🔊</button><div class="rom">Listen. Tap to hear it again.</div>'
               +'<button class="link" id="showTxt">Can\'t hear it? Show the text</button></div><div class="bj sm" id="hidTxt" style="display:none">'+J(npc.kana)+'</div>'
             : '<div class="bj '+(shown.length>12?'sm':'')+'">'+J(shown)+'</div>'+(save.set.romaji?'<div class="rom">'+esc(romaji(npc.kana))+'</div>':'')
               +'<button class="link" id="hearBtn">🔊 Hear it again</button>')
      +'</div>';
  } else {
    // show the line you are answering, so it reads like a conversation
    const prev = e.steps[e.stepIdx-1];
    if (prev && prev.npc) pre+='<div class="bub"><div class="who">'+esc(e.who)+' said:</div><div class="bj sm">'+J(prev.npc.jp)+'</div><div class="rom">'+esc(prev.npc.en)+'</div></div>';
    else pre+='<div class="bub you">You speak first.</div>';
  }
  q.pre=pre; q.main='';
  if (st.t==='mean' || st.t==='detail'){
    q.type = st.t==='mean'?'bmean':'bdetail';
    q.ask = st.t==='mean' ? 'What did they say?' : st.ask;
    const right = st.t==='mean' ? npc.en : st.right;
    const wrong = st.t==='mean' ? fill3(st.wrong, MEAN_POOL, (a,b)=>a===b, right) : st.wrong;
    q.opts = shuffle([{h:esc(right),ok:true}].concat(wrong.map(x=>({h:esc(x)}))));
    q.card = {jp:npc.jp, kana:npc.kana, mean:npc.en}; q.say=npc.jp; q.limit=20; q.fast=7;
  } else if (st.t==='reply'){
    q.type='breply'; q.ask='Pick your reply.';
    q.main='<div class="main en">'+esc(st.goal)+'</div>';
    const wrong = fill3(st.wrong, REPLY_POOL, (a,b)=>a.jp===b.jp||a.en===b.en, st.right);
    q.opts = shuffle([{h:J(st.right.jp)+romLine(st.right.kana),ok:true,ln:st.right}].concat(wrong.map(x=>({h:J(x.jp)+romLine(x.kana),ln:x}))));
    q.card = {jp:st.right.jp, kana:st.right.kana, mean:st.right.en}; q.say=st.right.jp; q.limit=25; q.fast=9;
  } else {
    q.type='order'; q.ask='Build your reply:';
    q.main='<div class="main en">'+esc(st.goal)+'</div>';
    q.item.chunks=st.chunks; q.item.why=st.why;
    let t=shuffle(st.chunks), g=0; while (t.join('|')===st.chunks.join('|') && g++<10) t=shuffle(st.chunks);
    q.tiles=t; q.placed=[];
    q.card = {jp:st.chunks.join(''), kana:st.kana, mean:st.goal}; q.say=st.chunks.join(''); q.limit=35; q.fast=14;
  }
  return q;
}

const UMAP = {}; UPGRADES.forEach(u=>UMAP[u.id]=u);

/* ---------- a run ---------- */
let run=null, phase='home', paused=false, tick=null, advanceTimer=null;

function missW(key){ return save.miss[key]||0; }
function pickWord(){
  const place = PLACES[run.floor].id;
  let pool = WORDS.filter(w => (w.place===place || w.place==='any') && run.recent.indexOf(w.key)<0);
  if (!pool.length) pool = WORDS;
  return weighted(pool, w => (w.place==='any'?0.45:1) * (1 + 2*missW(w.key)));
}
function pickFrom(list){
  let pool = list.filter(x=>run.recent.indexOf(x.key)<0); if(!pool.length) pool=list;
  return weighted(pool, x=>1+2*missW(x.key));
}
function comboMult(streak){ return streak<1 ? 1 : Math.min(run.st.comboMax, 1 + run.st.comboStep*(streak-1)); }

function startRun(){
  if (save.set.sound) unlockVoice();
  const hp = CFG.playerHP + 10*lv('hp');
  run = {floor:0, idx:0, hp:hp, maxHp:hp, streak:0, bestStreak:0, yen:0,
         right:0, total:0, missed:[], recent:[], elitesUsed:[], eliteOnFloor:0, enemy:null, q:null, t0:Date.now(), kills:0,
         picks:{}, rerolls:lv('reroll'),
         ab:{hint:1+lv('hint'), freeze:1+lv('freeze'), potion:1+lv('potion')},
         st:{baseDmg:CFG.baseDmg+lv('dmg'), comboStep:CFG.comboStep, comboMax:CFG.comboMax,
             fastMult:CFG.fastMult+0.1*lv('fastm'), fastAdd:0.5*lv('fast'), timeAdd:lv('time'),
             slowMult:1, lightning:0, buzzer:0, eliteDmg:0, bossArmor:0, armor:0, guard:0, wind:0, leech:0,
             yenMult:1+0.1*lv('yen'), restHeal:CFG.restHeal+5*lv('rest')}};
  showFloorIntro(false);
}
function spawnEnemy(){
  const p = PLACES[run.floor], f = run.floor, last = run.idx===CFG.enemiesPerFloor-1;
  let e;
  if (last){
    const sc = pickBoss(p.id), made = sc.make();
    e = {kind:'boss', face:sc.icon, name:sc.title, tag:'BOSS · a real conversation', id:sc.id, who:sc.who,
         goal:made.goal, steps:made.steps, stepIdx:0, hp:made.steps.length, maxHp:made.steps.length, misses:0};
  } else {
    const hp = CFG.enemyHP + CFG.enemyHPperFloor*f;
    const cands = Object.keys(save.miss).filter(k=>WMAP[k] && run.elitesUsed.indexOf(k)<0).sort((a,b)=>save.miss[b]-save.miss[a]);
    if (cands.length && run.eliteOnFloor<2 && Math.random()<CFG.eliteChance){
      const k = cands[rnd(Math.min(3,cands.length))];
      run.elitesUsed.push(k); run.eliteOnFloor++;
      const eh = Math.round(hp*CFG.eliteMult);
      e = {kind:'elite', face:'👹', name:WMAP[k].jp, word:k, hp:eh, maxHp:eh, tag:'★ ELITE · a word you missed', turn:0, used:[]};
    } else {
      const foe = p.foes[run.idx % p.foes.length];
      e = {kind:'normal', face:foe[0], name:foe[1], hp:hp, maxHp:hp, tag:''};
    }
  }
  run.enemy = e;
}
function enterEnemy(){ spawnEnemy(); if (run.enemy.kind==='boss') showBossIntro(); else nextQuestion(); }
function ehpText(e){ return e.kind==='boss' ? 'Conversation: '+(e.maxHp-e.hp)+' of '+e.maxHp+' steps done' : 'Enemy HP '+e.hp+' / '+e.maxHp; }
function nextQuestion(){
  const e = run.enemy; let q;
  if (e.kind==='boss'){
    q = makeBossQ(e.steps[e.stepIdx], e); e.stepIdx++;
  } else if (e.kind==='elite'){
    let w = WMAP[e.word];
    if (e.turn%2===1){
      const others = Object.keys(save.miss).filter(k=>WMAP[k] && k!==e.word);
      w = others.length ? WMAP[pick(others)] : pickWord();
    }
    e.turn++;
    q = makeWordQ(w, w.key===e.word ? e.used : null);
    if (w.key===e.word) e.used.push(q.type);
  } else {
    const r = Math.random();
    if (r<0.12) q = makePartQ(pickFrom(PARTS));
    else if (r<0.24) q = makeOrderQ(pickFrom(SENTS));
    else q = makeWordQ(pickWord());
  }
  run.recent.push(q.item.key); if (run.recent.length>18) run.recent.shift();
  q.limit += run.st.timeAdd; q.fast += run.st.fastAdd;
  q.left = q.limit*1000;
  run.q = q; phase='ask';
  renderFight();
  if (q.autoSay) speak(q.sayStart||q.say);
}

function answer(ok, chosen){
  if (phase!=='ask') return;
  phase='feedback';
  const q=run.q, e=run.enemy, key=q.item.key, st=run.st;
  const secs = (q.limit*1000 - q.left)/1000;
  run.total++;
  let fb = {ok:ok, timeout: chosen===-1, tags:[]};
  if (ok){
    run.right++; run.streak++; run.bestStreak=Math.max(run.bestStreak,run.streak);
    const combo = comboMult(run.streak), fast = secs<=q.fast;
    let mult = combo;
    if (combo>1) fb.tags.push('combo ×'+combo.toFixed(2));
    if (fast){ mult*=st.fastMult; fb.tags.push('⚡ fast ×'+st.fastMult.toFixed(2)); }
    else if (st.slowMult>1){ mult*=st.slowMult; fb.tags.push('🐢 steady ×'+st.slowMult.toFixed(2)); }
    if (st.lightning && secs<=2){ mult*=1+st.lightning; fb.tags.push('🌩️ lightning'); }
    if (st.buzzer && q.left<=3000){ mult*=1+st.buzzer; fb.tags.push('⏰ buzzer beater'); }
    if (st.eliteDmg && e.kind==='elite'){ mult*=1+st.eliteDmg; fb.tags.push('🎯 hunter'); }
    const dmg = Math.round(st.baseDmg*mult);
    e.hp = Math.max(0, e.hp-(e.kind==='boss'?1:dmg));
    if (fast && st.leech){ run.hp=Math.min(run.maxHp, run.hp+st.leech); fb.tags.push('🥟 +'+st.leech+' HP'); }
    let yen = (e.kind==='boss'?15:10)*combo;
    if (e.kind==='boss'){ fb.tags = fast ? ['⚡ fast: bonus yen'] : []; if (fast) yen*=1.5; }
    if (save.miss[key]){ save.miss[key]--; if(save.miss[key]<=0) delete save.miss[key]; }
    fb.dmg=dmg;
    if (e.hp<=0){ yen += e.kind==='boss'?300:e.kind==='elite'?150:50; fb.kill=true; run.kills++; }
    yen = Math.round(yen*st.yenMult);
    run.yen += yen; fb.yen=yen;
  } else {
    if (st.guard>0){ st.guard--; fb.guarded=true; } else run.streak=0;
    const raw = CFG.hurt + CFG.hurtPerFloor*run.floor + (e.kind==='boss'?CFG.gateHurtBonus:e.kind==='elite'?CFG.eliteHurtBonus:0);
    const hurt = Math.max(3, raw-st.armor-(e.kind==='boss'?st.bossArmor:0));
    run.hp = Math.max(0, run.hp-hurt); fb.hurt=hurt;
    if (run.hp<=0 && st.wind){ st.wind=0; run.hp=40; fb.wind=true; }
    if (!q.noMiss) save.miss[key] = Math.min(6, (save.miss[key]||0)+2);
    if (!run.missed.some(c=>c.jp===q.card.jp)) run.missed.push(q.card);
    if (e.kind==='boss'){            // the conversation moves on even after a mistake
      e.misses++; e.hp = Math.max(0, e.hp-1);
      if (e.hp<=0 && run.hp>0){ fb.kill=true; run.kills++; fb.yen=Math.round(300*st.yenMult); run.yen+=fb.yen; }
    }
  }
  writeSave();
  showFeedback(fb, chosen);
  speak(q.say);
  if (ok && !q.boss){ clearTimeout(advanceTimer); advanceTimer=setTimeout(advance, fb.kill?1300:1000); }
}
function advance(){
  clearTimeout(advanceTimer);
  if (phase!=='feedback') return;
  if (run.hp<=0) return endRun(false);
  if (run.enemy.hp<=0){
    run.idx++;
    if (run.idx>=CFG.enemiesPerFloor){
      if (run.floor>=PLACES.length-1) return endRun(true);
      return showPick(true, ()=>{ run.floor++; run.idx=0; run.eliteOnFloor=0; showFloorIntro(true); });
    }
    return showPick(false, enterEnemy);
  }
  nextQuestion();
}
function endRun(won){
  phase='end'; stopTick();
  if (won) run.yen += Math.round(500*run.st.yenMult);
  save.yen += run.yen; save.runs++; if(won) save.wins++;
  save.bestFloor = Math.max(save.bestFloor, won?PLACES.length:run.floor+1);
  save.bestStreak = Math.max(save.bestStreak||0, run.bestStreak);
  writeSave();
  renderEnd(won);
}

/* ---------- upgrade pick ---------- */
function rollPicks(rare){
  let pool = UPGRADES.filter(u => (!u.ok || u.ok(run)) && (!!rare === !!u.rare));
  const out=[];
  while (out.length<3 && pool.length){
    const u = pick(pool);
    out.push(u); pool = pool.filter(x=>x!==u);
  }
  return out;
}
function showPick(rare, next){
  phase='pick';
  let opts = rollPicks(rare), extra='';
  if (rare){   // boss win: a heal on top, and more for a flawless conversation
    const heal = Math.min(20, run.maxHp-run.hp); run.hp += heal;
    extra = 'You relax after the talk: ＋'+heal+' HP. ';
    if (run.enemy.misses===0){ run.ab.hint++; run.ab.freeze++; run.ab.potion++; extra += '<br>⭐ Flawless! ＋1 Hint, ＋1 Freeze, ＋1 Potion. '; }
    extra += '<br>';
  }
  const draw = ()=>{
    app.innerHTML = '<div class="over"><div class="box">'
      +'<h2 class="center">'+(rare?'🏆 Boss reward':'Pick 1 upgrade')+'</h2>'
      +'<p class="sub center">'+(rare?extra+'Boss rewards are stronger than normal upgrades. ':'')+'It lasts for this run. HP '+run.hp+' / '+run.maxHp+' · <span class="yen">¥'+run.yen+'</span></p>'
      +opts.map((u,i)=>'<button class="pick '+(u.rare?'rare':'')+'" data-i="'+i+'"><span class="pi">'+u.icon+'</span><span><b>'+(u.rare?'★ ':'')+u.name
        +(run.picks[u.id]?' <small>(have '+run.picks[u.id]+')</small>':'')+'</b><span>'+u.desc+'</span></span></button>').join('')
      +(run.rerolls>0?'<button class="ghost" id="reroll">🎲 Reroll choices ('+run.rerolls+' left)</button>':'')
      +'</div></div>';
    app.querySelectorAll('.pick').forEach(b=>b.onclick=()=>take(+b.dataset.i));
    const rr=$('reroll'); if (rr) rr.onclick=()=>{ run.rerolls--; opts=rollPicks(rare); draw(); };
  };
  const take = i=>{
    if (phase!=='pick' || !opts[i]) return;
    const u=opts[i]; u.f(run); run.picks[u.id]=(run.picks[u.id]||0)+1;
    phase='picked'; next();
  };
  run.takePick = take;
  draw();
}

/* ---------- abilities (buttons you can press during a question) ---------- */
function updateAbil(){
  const q=run.q, a=run.ab, live = phase==='ask';
  const set=(id,label,n,off)=>{ const b=$(id); if(!b) return; b.innerHTML=label+' <b>×'+n+'</b>'; b.disabled = !live || n<=0 || off; };
  set('ab_hint','🔍 Hint',a.hint, q.hinted);
  set('ab_freeze','⏸ Freeze',a.freeze, q.frozen);
  set('ab_potion','🧪 Potion',a.potion, run.hp>=run.maxHp);
}
function useHint(){
  const q=run.q; if (phase!=='ask' || paused || run.ab.hint<=0 || q.hinted) return;
  run.ab.hint--; q.hinted=true;
  if (q.type==='order'){
    const want=q.item.chunks; let k=0;
    while (k<q.placed.length && q.tiles[q.placed[k]]===want[k]) k++;
    const keep=q.placed.slice(0,k);
    const ti=q.tiles.findIndex((t,i)=>t===want[k] && keep.indexOf(i)<0);
    keep.push(ti); q.placed=keep; renderOrder(); updateAbil(); checkOrder();
  } else {
    const wrong = shuffle(q.opts.map((o,i)=>i).filter(i=>!q.opts[i].ok)).slice(0,2);
    wrong.forEach(i=>{ q.opts[i].gone=true; const b=app.querySelector('.opt[data-i="'+i+'"]'); if(b){ b.classList.add('gone'); b.disabled=true; } });
    updateAbil();
  }
}
function useFreeze(){
  const q=run.q; if (phase!=='ask' || paused || run.ab.freeze<=0 || q.frozen) return;
  run.ab.freeze--; q.frozen=true; const l=$('tlbl'); if(l) l.textContent='⏸ timer frozen'; updateAbil();
}
function usePotion(){
  if (phase!=='ask' || paused || run.ab.potion<=0 || run.hp>=run.maxHp) return;
  run.ab.potion--; run.hp=Math.min(run.maxHp, run.hp+30);
  $('pbar').style.width=(100*run.hp/run.maxHp)+'%'; $('php').textContent='Your HP '+run.hp+' / '+run.maxHp; updateAbil();
}

/* ---------- timer ---------- */
function startTick(){
  stopTick(); let last=Date.now();
  tick = setInterval(()=>{
    const now=Date.now(), d=now-last; last=now;
    if (phase!=='ask' || paused || !run || !run.q || run.q.frozen) return;
    run.q.left -= Math.min(d,400);
    const q=run.q, bar=$('tbar');
    if (bar){
      bar.style.width = Math.max(0, q.left/(q.limit*10))+'%';
      const fastLeft = (q.limit*1000-q.left) <= q.fast*1000;
      bar.parentNode.classList.toggle('fastzone', fastLeft);
      const lbl=$('tlbl'); if(lbl) lbl.textContent = fastLeft ? '⚡ fast bonus ×'+run.st.fastMult.toFixed(2) : Math.ceil(q.left/1000)+'s';
    }
    if (q.left<=0) answer(false,-1);
  },100);
}
function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }

/* ---------- screens ---------- */
let app=null;

function toggleRow(id, title, hint, on){
  return '<div class="row"><div>'+title+'<small>'+hint+'</small></div><button class="tog '+(on?'on':'')+'" data-tog="'+id+'">'+(on?'✔ ON':'OFF')+'</button></div>';
}
function settingsHTML(){
  return toggleRow('romaji','Romaji','Show romaji next to kana',save.set.romaji)
       + toggleRow('sound','Sound','Speak words with the device voice',save.set.sound)
       + toggleRow('listen','Listening questions','Turn off if you have no headphones',save.set.listen)
       + '<div class="row"><div>Voice check<small id="vstat">'+esc(voiceStatus())+'</small></div><button class="tog" data-voicetest="1">🔊 Test</button></div>';
}
function wireToggles(root, rerender){
  root.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{ const k=b.dataset.tog; save.set[k]=!save.set[k]; writeSave(); if(k==='sound'&&save.set.sound){ unlockVoice(); speak('こんにちは'); } rerender(); });
  root.querySelectorAll('[data-voicetest]').forEach(b=>b.onclick=()=>{
    unlockVoice(); speak('こんにちは。これはテストです。', true);
    setTimeout(()=>{ loadVoices(); const v=root.querySelector('#vstat'); if(v) v.textContent=voiceStatus()+' You should have heard “konnichiwa.”'; }, 600);
  });
}

let offlineNote='';
function renderHome(){
  phase='home'; stopTick();
  const missN = Object.keys(save.miss).filter(k=>WMAP[k]).length;
  app.innerHTML =
    '<h1>'+J('旅')+' Tabi Quest</h1><p class="sub">Fight your way through a trip to Japan.</p>'

   +'<div class="card"><div class="stats">'
   +'<div class="stat"><b class="yen">¥'+save.yen+'</b><span>Yen saved</span></div>'
   +'<div class="stat"><b>'+save.bestFloor+' / '+PLACES.length+'</b><span>Best floor</span></div>'
   +'<div class="stat"><b>'+save.runs+'</b><span>Runs ('+save.wins+' completed)</span></div>'
   +'<div class="stat"><b>'+missN+'</b><span>Words waiting as elites</span></div>'
   +'</div></div>'
   +'<div class="card">'+settingsHTML()+'</div>'

   +'Right answers hit the enemy. Answer fast and keep a streak to build your combo. '

   +'After each enemy you pick 1 of 3 upgrades for the run. Each floor ends with a boss: a real conversation with several steps. Finish it to win a stronger reward. '
   +'You also carry three abilities: 🔍 Hint removes two wrong answers, ⏸ Freeze stops the timer, 🧪 Potion heals 30 HP. '
   +'Spend yen in the shop on upgrades that stay forever.<br><br>'
   +WORDS.length+' words, '+PARTS.length+' particle questions, '+SENTS.length+' sentences loaded. Version 0.3.1.'
   +(offlineNote?'<br>'+offlineNote:'')+'</div>'
   +'<button class="ghost" id="reset">Reset all progress</button>';
  $('go').onclick = startRun; $('shop').onclick = renderShop;
  wireToggles(app, renderHome);
  let armed=false;
  $('reset').onclick = function(){
    if (!armed){ armed=true; this.textContent='Tap again to erase everything'; return; }
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    save = {yen:0, runs:0, wins:0, bestFloor:0, bestStreak:0, miss:{}, shop:{}, boss:{}, set:save.set}; writeSave(); renderHome();
  };
}

function renderShop(){
  phase='shop'; stopTick();
  app.innerHTML =
    '<div class="top"><button class="mini" id="back" aria-label="Back">←</button><div class="where">Shop · upgrades that stay forever</div><div class="yen">¥'+save.yen+'</div></div>'
   +SHOP.map(it=>{
      const l=lv(it.id), maxed=l>=it.max, c=shopCost(it), can=save.yen>=c;
      return '<div class="card shopit"><div class="si">'+it.icon+'</div><div class="sinfo"><b>'+it.name+'</b>'
        +'<div class="note">'+it.per+' per level</div>'
        +'<div class="note">Level '+l+' / '+it.max+'  '+'■'.repeat(l)+'□'.repeat(it.max-l)+'</div></div>'
        +'<button class="buy '+(maxed||!can?'no':'')+'" data-id="'+it.id+'" '+(maxed||!can?'disabled':'')+'>'
        +(maxed?'MAX':can?'Buy<br>¥'+c:'Need<br>¥'+c)+'</button></div>';
    }).join('')
   +'<button class="ghost" id="back2">Back</button>';
  $('back').onclick=renderHome; $('back2').onclick=renderHome;
  app.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{
    const it=SHOP.find(x=>x.id===b.dataset.id), c=shopCost(it);
    if (lv(it.id)>=it.max || save.yen<c) return;
    save.yen-=c; save.shop[it.id]=lv(it.id)+1; writeSave();
    const y=window.scrollY; renderShop(); window.scrollTo(0,y);
  });
}

function showFloorIntro(rested){
  phase='intro'; stopTick();
  const p = PLACES[run.floor]; let heal=0;
  if (rested){ heal = Math.min(run.st.restHeal, run.maxHp-run.hp); run.hp += heal; }
  app.innerHTML = '<div class="over"><div class="box center">'
    +'<div class="note">Floor '+(run.floor+1)+' of '+PLACES.length+'</div>'
    +'<div class="placejp">'+J(p.jp)+'</div><h2>'+p.name+'</h2>'
    +(rested?'<p class="sub">Floor cleared. You rest on the way: ＋'+heal+' HP<br>You have '+run.hp+' / '+run.maxHp+' HP and <span class="yen">¥'+run.yen+'</span>.</p>'
            :'<p class="sub">'+(CFG.enemiesPerFloor-1)+' enemies, then a boss conversation.</p>')
    +'<button class="big" id="enter">Enter ▶</button></div></div>';
  $('enter').onclick = ()=>{ enterEnemy(); startTick(); };
}

function renderFight(){
  const p=PLACES[run.floor], e=run.enemy, q=run.q;
  let body;
  if (q.type==='order'){
    body = '<div class="tray" id="tray"></div><div class="pool" id="pool"></div>';
  } else {
    body = '<div class="opts">'+q.opts.map((o,i)=>'<button class="opt" data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+o.h+'<span class="mk"></span></button>').join('')+'</div>';
  }
  app.innerHTML =
    '<div class="top"><button class="mini" id="menuBtn" aria-label="Pause">☰</button>'
   +'<div class="where">Floor '+(run.floor+1)+'/'+PLACES.length+' · '+J(p.jp)+' · Enemy '+(run.idx+1)+'/'+CFG.enemiesPerFloor+'</div>'
   +'<div class="yen">¥'+run.yen+'</div></div>'
   +'<div class="enemy '+e.kind+'" id="enemyBox"><div class="face">'+e.face+'</div><div class="info">'
   +(e.tag?'<div class="tag">'+e.tag+'</div>':'')
   +'<div class="name">'+(e.kind==='elite'?J(e.name):esc(e.name))+'</div>'
   +'<div class="bar e"><i id="ebar" style="width:'+(100*e.hp/e.maxHp)+'%"></i></div>'
   +'<div class="hpnum" id="ehp">'+ehpText(e)+'</div></div></div>'
   +'<div class="timer fastzone"><i id="tbar"></i></div><div class="timerlbl" id="tlbl"></div>'
   +'<div class="prompt'+(q.boss?' bossp':'')+'">'+(q.pre||'')+'<div class="ask">'+esc(q.ask)+'</div>'+q.main+'</div>'
   +body
   +'<div class="me" id="meBox">'
   +'<div class="abil"><button class="ab" id="ab_hint"></button><button class="ab" id="ab_freeze"></button><button class="ab" id="ab_potion"></button></div>'
   +'<div class="line"><span id="php">Your HP '+run.hp+' / '+run.maxHp+'</span>'
   +'<span class="combo" id="combo">'+comboText()+'</span></div>'
   +'<div class="bar p"><i id="pbar" style="width:'+(100*run.hp/run.maxHp)+'%"></i></div></div>'
   +'<div id="sheetHost"></div>';
  $('menuBtn').onclick = showPause;
  $('ab_hint').onclick=useHint; $('ab_freeze').onclick=useFreeze; $('ab_potion').onclick=usePotion;
  updateAbil();
  if (q.type==='order') renderOrder();
  else app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const hb=$('hearBtn'); if (hb) hb.onclick=()=>speak(q.sayStart||q.say);
  const sx=$('showTxt'); if (sx) sx.onclick=()=>{ $('hidTxt').style.display='block'; sx.style.display='none'; };
}
function comboText(){
  const g = run.st.guard>0 ? ' · 🧿'+run.st.guard : '';
  return (run.streak>0 ? '🔥 Streak '+run.streak+' · Combo ×'+comboMult(run.streak+1).toFixed(2) : 'No streak yet') + g;
}
function choose(i){ if(phase!=='ask'||paused||!run.q.opts[i]||run.q.opts[i].gone) return; answer(!!run.q.opts[i].ok, i); }
function checkOrder(){
  const q=run.q;
  if (phase==='ask' && q.placed.length===q.tiles.length) answer(q.placed.map(i=>q.tiles[i]).join('|')===q.item.chunks.join('|'), 0);
}
function renderOrder(){
  const q=run.q, tray=$('tray'), pool=$('pool'); if(!tray) return;
  tray.innerHTML = q.placed.map((ti,pos)=>'<button class="tile" lang="ja" data-pos="'+pos+'">'+esc(q.tiles[ti])+'</button>').join('');
  pool.innerHTML = q.tiles.map((t,ti)=>'<button class="tile '+(q.placed.indexOf(ti)>=0?'used':'')+'" lang="ja" data-ti="'+ti+'">'+esc(t)+'</button>').join('');
  tray.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ if(phase!=='ask'||paused)return; q.placed.splice(+b.dataset.pos,1); renderOrder(); });
  pool.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ if(phase!=='ask'||paused)return; q.placed.push(+b.dataset.ti); renderOrder(); checkOrder(); });
}

function cardHTML(c, label){
  const showRd = c.kana.replace(/ /g,'') !== c.jp;
  return '<div class="ans"><div class="lbl">'+label+'</div>'
    +'<div class="jp '+(c.jp.length>9?'long':'')+'">'+J(c.jp)+'</div>'
    +(showRd?'<div class="rd">'+J(c.kana)+'</div>':'')
    +(save.set.romaji?'<div class="rm">'+esc(romaji(c.kana))+'</div>':'')
    +'<div class="mn">'+esc(c.mean)+'</div></div>';
}
/* The "Why" box shown after a miss. */
function whyHTML(q, chosen){
  const L=[]; const o = (chosen>=0 && q.opts) ? q.opts[chosen] : null;
  if (q.boss){
    const st=q.step;
    if (st.npc && (q.type==='breply'||q.type==='order')) L.push('They said: '+J(st.npc.jp)+' “'+esc(st.npc.en)+'”');
    if (q.type==='breply' && o && o.ln && !o.ok) L.push('You picked '+J(o.ln.jp)+'. That means “'+esc(o.ln.en)+'”');
    if (q.type==='order'){
      if (q.placed.length) L.push('You built: '+J(q.placed.map(i=>q.tiles[i]).join(' ')));
      L.push('Right order: '+J(q.item.chunks.join(' ')));
    }
    if (st.why) L.push(esc(st.why));
  } else if (q.type==='particle'){
    L.push(esc(q.item.why));
    if (o && !o.ok && PARTICLE_INFO[o.p]) L.push('You picked '+J(o.p)+'. '+J(o.p)+' '+esc(PARTICLE_INFO[o.p])+'.');
  } else if (q.type==='order'){
    if (q.placed.length) L.push('You built: '+J(q.placed.map(i=>q.tiles[i]).join(' ')));
    L.push('Right order: '+J(q.item.chunks.join(' ')));
    L.push(esc(q.item.why));
    L.push('Tip: a particle comes right after the word it marks. The verb or ですか comes last.');
  } else {
    if (o && o.src){
      const s=o.src;
      L.push('You picked '+J(s.jp)+(s.kana.replace(/ /g,'')!==s.jp?' ('+J(s.kana)+')':'')+'. That means “'+esc(s.mean)+'.”');
    }
    if (o && o.note) L.push(esc(o.note));
    const hints=[], seen={};
    for (const ch of q.item.jp){ if (KH[ch] && !seen[ch]){ seen[ch]=1; hints.push(J(ch)+' '+esc(KH[ch])); } }
    if (hints.length) L.push('Kanji: '+hints.slice(0,5).join(' · '));
  }
  return L.length ? '<div class="why"><div class="lbl">Why</div>'+L.map(x=>'<div>'+x+'</div>').join('')+'</div>' : '';
}
function showFeedback(fb, chosen){
  const q=run.q, e=run.enemy;
  // mark the buttons with icons as well as colour
  app.querySelectorAll('.opt').forEach(b=>{
    const i=+b.dataset.i; b.disabled=true;
    if (q.opts[i].ok){ b.classList.add('right'); b.querySelector('.mk').textContent='✔'; }
    else if (i===chosen){ b.classList.add('wrong'); b.querySelector('.mk').textContent='✘'; }
  });
  app.querySelectorAll('.tile').forEach(b=>b.disabled=true);
  $('ebar').style.width=(100*e.hp/e.maxHp)+'%'; $('ehp').textContent=ehpText(e);
  $('pbar').style.width=(100*run.hp/run.maxHp)+'%'; $('php').textContent='Your HP '+run.hp+' / '+run.maxHp;
  $('combo').textContent=comboText(); updateAbil();
  let h;
  if (fb.ok && q.boss){
    const npc=q.step.npc, mine=(q.type==='breply'||q.type==='order');
    h = '<div class="sheet hit"><div class="in"><div class="head">✔ Correct'+(fb.kill?' · Conversation complete!':'')+'</div>'
      +'<div class="detail">'+(fb.tags.length?fb.tags.join(' · ')+' · ':'')+'<span class="yen">＋¥'+fb.yen+'</span></div>'
      +cardHTML(q.card, mine?'You said':'They said')
      +(mine&&npc?'<div class="why"><div>They said: '+J(npc.jp)+' “'+esc(npc.en)+'”</div></div>':'')
      +'<div class="btns"><button class="ghost" id="again" aria-label="Hear it">🔊</button><button class="big" id="cont">'+(fb.kill?'Claim reward ▶':'Continue ▶')+'</button></div></div></div>';
  } else if (fb.ok){
    $('enemyBox').classList.add('shake');
    h = '<div class="sheet hit"><div class="in pop"><div class="head">✔ Correct'+(fb.kill?' · Enemy defeated!':'')+'</div>'
      +'<div class="detail">You hit for '+fb.dmg+(fb.tags.length?' · '+fb.tags.join(' · '):'')+' · <span class="yen">＋¥'+fb.yen+'</span></div>'
      +'<div class="detail">'+J(q.card.jp)+(q.card.kana.replace(/ /g,'')!==q.card.jp?' · '+J(q.card.kana):'')+' · '+esc(q.card.mean)+'</div></div></div>';
  } else {
    $('meBox').classList.add('shake');
    h = '<div class="sheet miss"><div class="in"><div class="head">'+(fb.timeout?'⏱ Out of time':'✘ Wrong')+'</div>'
      +'<div class="detail">You take '+fb.hurt+' damage. '+(fb.guarded?'🧿 Omamori kept your streak.':'Streak lost.')
      +(fb.wind?' 🪽 Second Wind saved you!':'')+(q.isWord?' This word will come back as an elite.':'')+(q.boss&&run.hp>0?(fb.kill?' The conversation is over.':' The conversation goes on.'):'')+'</div>'
      +cardHTML(q.card,'Correct answer')
      +whyHTML(q, fb.timeout?-1:chosen)
      +'<div class="btns"><button class="ghost" id="again" aria-label="Hear it">🔊</button><button class="big" id="cont">'+(run.hp<=0?'See results ▶':'Continue ▶')+'</button></div></div></div>';
  }
  $('sheetHost').innerHTML = h;
  if ($('cont')){ $('cont').onclick=advance; $('again').onclick=()=>speak(q.say); }
}

function buildHTML(){
  const ids=Object.keys(run.picks);
  if (!ids.length) return '<div class="note">No upgrades picked yet.</div>';
  return ids.map(id=>'<div class="note" style="color:var(--text)">'+UMAP[id].icon+' '+UMAP[id].name+(run.picks[id]>1?' ×'+run.picks[id]:'')+'</div>').join('');
}
function showPause(){
  if (!run || (phase!=='ask' && phase!=='feedback')) return;
  if ($('pauseOver')) return;
  paused=true;
  const d=document.createElement('div'); d.className='over'; d.id='pauseOver';
  const draw=()=>{
    d.innerHTML='<div class="box"><h2 class="center">Paused</h2><button class="big" id="resume">▶ Resume</button>'
      +'<div class="card"><b>Your upgrades this run</b>'+buildHTML()+'</div>'
      +'<div class="card">'+settingsHTML()+'</div>'
      +'<button class="ghost" id="quit">End this run (keep the yen)</button></div>';
    d.querySelector('#resume').onclick=()=>{ d.remove(); paused=false; };
    let armed=false;
    d.querySelector('#quit').onclick=function(){ if(!armed){armed=true; this.textContent='Tap again to end the run'; return;} d.remove(); paused=false; clearTimeout(advanceTimer); endRun(false); };
    wireToggles(d, draw);
  };
  draw(); document.body.appendChild(d);
}

function renderEnd(won){
  const mins = Math.max(1, Math.round((Date.now()-run.t0)/60000));
  const acc = run.total ? Math.round(100*run.right/run.total) : 0;
  const p = PLACES[Math.min(run.floor,PLACES.length-1)];
  app.innerHTML =
    '<h1>'+(won?'🎌 Trip complete!':'💤 Trip cut short')+'</h1>'
   +'<p class="sub">'+(won?'You cleared all '+PLACES.length+' floors. Bonus yen added.':'You made it to floor '+(run.floor+1)+': '+J(p.jp)+' '+p.name+'.')+'</p>'
   +'<div class="card"><div class="stats">'
   +'<div class="stat"><b class="yen">＋¥'+run.yen+'</b><span>Yen earned</span></div>'
   +'<div class="stat"><b>'+run.right+' / '+run.total+'</b><span>Right answers ('+acc+'%)</span></div>'
   +'<div class="stat"><b>'+run.bestStreak+'</b><span>Best streak</span></div>'
   +'<div class="stat"><b>'+mins+' min</b><span>'+run.kills+' enemies beaten</span></div>'
   +'</div></div>'
   +'<button class="big" id="again2">▶ New run</button>'
   +'<button class="ghost" id="shop2">🛒 Shop · <span class="yen">¥'+save.yen+'</span></button>'
   +(run.missed.length ? '<div class="card"><b>Missed this run</b><div class="note">These come back more often, as elites.</div>'
       +run.missed.map(c=>'<div class="missrow"><div class="a">'+J(c.jp)+'</div><div class="b">'
       +(c.kana.replace(/ /g,'')!==c.jp?J(c.kana)+' · ':'')+(save.set.romaji?esc(romaji(c.kana))+' · ':'')+esc(c.mean)+'</div></div>').join('')+'</div>'
     : '<div class="card">No misses. Perfect run!</div>')
   +'<button class="ghost" id="home">Home</button>';
  $('again2').onclick=startRun; $('home').onclick=renderHome; $('shop2').onclick=renderShop;
  window.scrollTo(0,0);
}

/* ---------- start-up ---------- */
function boot(){
  app = $('app');
  loadSave();
  if (typeof speechSynthesis!=='undefined'){ loadVoices(); try{ speechSynthesis.onvoiceschanged=loadVoices; }catch(e){} }
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden && phase==='ask') showPause(); });
  document.addEventListener('keydown', ev=>{
    if (paused || !run) return;
    if (phase==='ask' && run.q && run.q.type!=='order' && ev.key>='1' && ev.key<='4') choose(+ev.key-1);
    else if (phase==='pick' && ev.key>='1' && ev.key<='3') run.takePick(+ev.key-1);
    else if (phase==='feedback' && (ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); advance(); }
  });
  if (location.protocol==='file:') offlineNote='Running from a file on this computer. Works offline.';
  else if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{
      offlineNote='✔ Saved on this device. Works offline.'; if(phase==='home') renderHome();
    }).catch(()=>{});
  }
  renderHome();
}
if (typeof document!=='undefined' && document.getElementById) boot();
